[project]
name = "forgecast"
version = "0.3.0"
description = "Gridpulse: calibrated map of the AI power buildout."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Forgecast"}]
keywords = ["grid", "data-center", "forecast", "map", "energy"]
dependencies = [
  "pydantic>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dateutil>=2.8",
  "h3>=4.5,<5",
  "duckdb>=1.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
forgecast = "forgecast.cli:app"
gridpulse = "forgecast.cli:app"

[project.urls]
Homepage = "https://github.com/nikoskiouris/forgecast"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
